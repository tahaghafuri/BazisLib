name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what limitation are you hitting?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API, behavior, documentation, or build change you want.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - bzscore
        - bzshlp
        - bzsnet
        - examples
        - tests
        - installer
        - documentation
        - other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention any existing workaround or alternative design.

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Note any expected impact on legacy Visual Studio, WDK, POSIX, or MacOS kernel targets.
